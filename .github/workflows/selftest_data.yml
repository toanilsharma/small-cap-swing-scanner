name: CI Self-Test Data Pipe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify state files and catch allowlist drift
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import sys

          # 1. If scan_results.json exists, assert json.load() parses, else print info & continue
          if os.path.exists("scan_results.json"):
              try:
                  with open("scan_results.json", "r", encoding="utf-8") as f:
                      scan_data = json.load(f)
                  assert isinstance(scan_data, dict), "scan_results.json must contain a JSON object!"
                  signals_cnt = len(scan_data.get('signals', []))
                  watchlist_cnt = len(scan_data.get('watchlist', []))
                  print(f"[OK] scan_results.json exists and parsed successfully ({signals_cnt} signals, {watchlist_cnt} watchlist items).")
              except Exception as e:
                  raise AssertionError(f"Failed to parse scan_results.json: {e}")
          else:
              print("no scan yet (expected on fresh repo / weekends)")

          # 2. Assert the set of state filenames the workflows commit is a subset of the existence-tolerant loop
          LOOP_ALLOWLIST = {
              "scan_results.json",
              "trades.json",
              "open_positions.json",
              "alert_settings.json",
              "tg_offset.txt",
              "deals.json",
              "events.json"
          }

          workflow_dir = ".github/workflows"
          workflow_committed_files = set()
          for wf in os.listdir(workflow_dir):
              if (wf.endswith(".yml") or wf.endswith(".yaml")) and wf != "selftest_data.yml":
                  with open(os.path.join(workflow_dir, wf), "r", encoding="utf-8") as fh:
                      content = fh.read()
                      for m in re.finditer(r"for\s+f\s+in\s+([\w\s\.-]+);", content):
                          for fname in m.group(1).split():
                              if fname:
                                  workflow_committed_files.add(fname)

          print(f"Existence-tolerant loop allowlist: {LOOP_ALLOWLIST}")
          print(f"Workflow state files committed: {workflow_committed_files}")

          assert workflow_committed_files.issubset(LOOP_ALLOWLIST), (
              f"Allowlist drift! Workflows commit files not in allowlist: {workflow_committed_files - LOOP_ALLOWLIST}"
          )
          print("[OK] All workflow committed state files are a subset of the existence-tolerant loop allowlist.")
          EOF

      - name: Check anonymous raw URL status
        run: |
          # Read <REPO> from repository dynamically
          REPO_SLUG="${GITHUB_REPOSITORY}"
          if [ -z "$REPO_SLUG" ]; then
            ORIGIN_URL=$(git config --get remote.origin.url || echo "toanilsharma/small-cap-swing-scanner")
            REPO_SLUG=$(echo "$ORIGIN_URL" | sed -E 's#^.*github.com[:/]([^/]+/[^/]+)(\.git)?$#\1#')
          fi
          RAW_URL="https://raw.githubusercontent.com/${REPO_SLUG}/main/scan_results.json"
          echo "Anonymous raw URL: $RAW_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RAW_URL" || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "[INFO] Public raw URL returned 200 (live scan data accessible)."
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "[INFO] Public raw URL returned 404 (expected before first scan / on weekends)."
          else
            echo "[INFO] Public raw URL returned HTTP $HTTP_STATUS."
          fi
          exit 0

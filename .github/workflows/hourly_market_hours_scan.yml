# Hourly Market-Hours Scan
# Cron: 30 4-10 * * 1-5
# UTC 04:30, 05:30, 06:30, 07:30, 08:30, 09:30, 10:30 Mon-Fri
# IST (UTC+5:30): 10:00, 11:00, 12:00, 13:00, 14:00, 15:00, 16:00 Mon-Fri (hourly during NSE market hours)
name: Hourly Market-Hours Scan

on:
  schedule:
    - cron: "30 4-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scanner
        env:
          QUIET: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_GIT_PUSH: "1"
        run: |
          python main.py

      - name: Commit and push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          staged=0
          for f in scan_results.json trades.json open_positions.json alert_settings.json tg_offset.txt deals.json events.json; do
            if [ -f "$f" ]; then git add "$f" && staged=1; fi
          done
          if [ "$staged" -eq 0 ]; then echo "No state files present to stage; nothing to commit."; exit 0; fi
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: sync state [skip ci]"
          git pull --rebase origin main || echo "WARN: rebase skipped"
          git push origin main || { sleep 3; git pull --rebase origin main || true; git push origin main; }

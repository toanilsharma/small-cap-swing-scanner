name: Daily Small-Cap Scan

on:
  schedule:
    - cron: "45 10 * * 1-5"  # 10:45 UTC = 16:15 IST, Monday through Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKIP_GIT_PUSH: "1"
        run: |
          python main.py

      - name: Fetch and merge institutional deals & delivery data
        run: |
          python scripts/fetch_nse_deals.py || echo "WARN: Deals fetch failed safely"

      - name: Nightly OHLCV universe archive
        run: |
          python scripts/archive_ohlcv.py || echo "WARN: OHLCV archive failed safely"

      - name: Commit and push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          staged=0
          for f in scan_results.json trades.json open_positions.json alert_settings.json tg_offset.txt deals.json events.json; do
            if [ -f "$f" ]; then git add "$f" && staged=1; fi
          done
          if [ -d "archive" ]; then git add archive/ && staged=1; fi
          if [ "$staged" -eq 0 ]; then echo "No state files present to stage; nothing to commit."; exit 0; fi
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "chore: sync state [skip ci]"
          git pull --rebase origin main || echo "WARN: rebase skipped"
          git push origin main || { sleep 3; git pull --rebase origin main || true; git push origin main; }
